name: Release artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver da tag aprovada, sem o prefixo v
        required: true
        type: string
      publish_npm:
        description: Publicar os tarballs verificados no npm por Trusted Publishing/OIDC
        required: true
        default: false
        type: boolean
      publish_github_release:
        description: Criar GitHub Release com a coleção verificada
        required: true
        default: false
        type: boolean
      publish_cdn:
        description: Publicar os assets imutáveis verificados no R2 e validar o domínio público do CDN
        required: true
        default: false
        type: boolean

jobs:
  prepare:
    name: Prepare one verified collection
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
      - name: Verify release tag belongs to main
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "version must be a semver value without the v prefix" >&2
            exit 1
          fi
          tag="v$RELEASE_VERSION"
          expected="$(git rev-parse --verify --quiet "refs/tags/${tag}^{commit}")" || {
            echo "approved tag ${tag} was not found" >&2
            exit 1
          }
          if [[ "$(git rev-parse HEAD)" != "$expected" ]]; then
            echo "checkout does not match ${tag}" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$expected" origin/main; then
            echo "${tag} must reference a commit reachable from main" >&2
            exit 1
          fi
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.5.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sanitize:public
      - run: pnpm licenses:verify
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit msedge
      - run: pnpm test:e2e
      - run: pnpm release:prepare
        env:
          CONSULTA_RELEASE_VERSION: ${{ inputs.version }}
          CONSULTA_RELEASE_SOURCE_TAG: v${{ inputs.version }}
      - run: pnpm release:verify
      - run: pnpm release:verify-consumer
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: consulta-release-${{ inputs.version }}
          path: .release-artifacts
          if-no-files-found: error
          retention-days: 14
          # The verified release collection intentionally lives in a dot
          # directory. upload-artifact v6 excludes hidden paths by default.
          include-hidden-files: true

  publish-npm:
    name: Publish verified npm tarballs
    needs: prepare
    if: inputs.publish_npm
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: consulta-release-${{ inputs.version }}
          path: release-artifacts
      - run: node scripts/verify-release-artifacts.mjs
        env:
          CONSULTA_RELEASE_OUTPUT_DIR: release-artifacts
          CONSULTA_EXPECTED_RELEASE_VERSION: ${{ inputs.version }}
      - run: |
          for archive in release-artifacts/packages/*.tgz; do
            npm publish "$archive" --access public --provenance
          done

  publish-github-release:
    name: Publish verified GitHub Release
    needs: prepare
    if: inputs.publish_github_release
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: consulta-release-${{ inputs.version }}
          path: release-artifacts
      - run: node scripts/verify-release-artifacts.mjs
        env:
          CONSULTA_RELEASE_OUTPUT_DIR: release-artifacts
          CONSULTA_EXPECTED_RELEASE_VERSION: ${{ inputs.version }}
      - run: |
          tag="v$RELEASE_VERSION"
          gh release create "$tag" \
            --verify-tag \
            --title "Consulta Autofill $tag" \
            --generate-notes \
            release-artifacts/SHA256SUMS \
            release-artifacts/release-manifest.json \
            release-artifacts/sbom.cdx.json \
            release-artifacts/packages/*.tgz
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
      # Semantic release assets are immutable. A repeated filename must fail
      # instead of silently replacing an asset attached to an approved tag.
      - run: find release-artifacts/cdn -type f -print0 | xargs -0 gh release upload "v$RELEASE_VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}

  publish-cdn:
    name: Publish verified immutable CDN assets
    needs: prepare
    if: inputs.publish_cdn
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.5.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: consulta-release-${{ inputs.version }}
          path: release-artifacts
      - run: pnpm release:verify
        env:
          CONSULTA_RELEASE_OUTPUT_DIR: release-artifacts
          CONSULTA_EXPECTED_RELEASE_VERSION: ${{ inputs.version }}
      - run: pnpm release:publish-cdn
        env:
          CONSULTA_RELEASE_OUTPUT_DIR: release-artifacts
          CONSULTA_EXPECTED_RELEASE_VERSION: ${{ inputs.version }}
          CONSULTA_R2_ACCOUNT_ID: ${{ vars.CONSULTA_R2_ACCOUNT_ID }}
          CONSULTA_R2_BUCKET: ${{ vars.CONSULTA_R2_BUCKET }}
          CONSULTA_CDN_PUBLIC_BASE_URL: ${{ vars.CONSULTA_CDN_PUBLIC_BASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CONSULTA_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CONSULTA_R2_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.CONSULTA_R2_SESSION_TOKEN }}
